services:
  api:
    build:
      context: ./services/api
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/api:/app

  web:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/workspace
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./apps/web:/app
    depends_on:
      - api
